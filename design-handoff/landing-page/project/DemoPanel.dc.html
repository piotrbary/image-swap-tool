<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onPick }}" title="Kliknij, aby wczytać obraz" style="position:relative; width:100%; aspect-ratio:4 / 3; display:flex; align-items:center; justify-content:center; border:2px {{ borderStyle }} hsl(var(--border)); border-radius:var(--radius-lg); background:hsl(var(--card)); cursor:pointer; overflow:hidden; transition:border-color 150ms var(--ease-standard), box-shadow 150ms var(--ease-standard);" style-hover="border-color:hsl(var(--primary)); box-shadow:var(--shadow-md);">
  <sc-if value="{{ image }}" hint-placeholder-val="">
    <img src="{{ image }}" alt="{{ label }}" style="width:100%; height:100%; object-fit:contain;">
  </sc-if>
  <sc-if value="{{ noImage }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px; color:hsl(var(--muted-foreground)); user-select:none; text-align:center; padding:12px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px; height:40px; opacity:0.5;">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <strong style="font-size:14px; font-weight:500;">Wczytaj obraz</strong>
      <small style="font-size:12px; opacity:0.7;">Kliknij, aby wybrać</small>
    </div>
  </sc-if>
  <sc-if value="{{ image }}" hint-placeholder-val="">
    <div style="position:absolute; bottom:8px; left:50%; transform:translateX(-50%); background:hsl(var(--foreground) / 0.7); color:hsl(var(--background)); font-size:12px; font-weight:600; padding:3px 10px; border-radius:9999px; letter-spacing:0.04em; text-transform:uppercase; pointer-events:none;">{{ label }}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:230,&quot;height&quot;:172},&quot;image&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Obraz 1&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  renderVals() {
    const img = this.props.image || null;
    return {
      image: img,
      noImage: !img,
      label: this.props.label,
      onPick: this.props.onPick,
      borderStyle: img ? 'solid' : 'dashed',
    };
  }
}
</script>
</body>
</html>
