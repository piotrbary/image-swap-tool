kind = "web"
previewPath = "/"
title = "Image Swap — Landing"
version = "1.0.0"
id = "artifacts/landing-page"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 4321

[services.development]
run = "pnpm --filter @workspace/landing-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing-page", "run", "build" ]
publicDir = "artifacts/landing-page/dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "4321"
BASE_PATH = "/"
