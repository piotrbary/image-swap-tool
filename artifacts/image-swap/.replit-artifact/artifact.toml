kind = "web"
previewPath = "/"
title = "Image Swap"
version = "1.0.0"
id = "artifacts/image-swap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23428

[services.development]
run = "pnpm --filter @workspace/image-swap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/image-swap", "run", "build" ]
publicDir = "artifacts/image-swap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23428"
BASE_PATH = "/"
